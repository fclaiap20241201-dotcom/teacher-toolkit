<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子計算機二年級 — 課堂即時答題大螢幕看板</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent-a: #ef4444;
      --accent-b: #3b82f6;
      --accent-c: #eab308;
      --accent-d: #10b981;
      --correct: #22c55e;
      --correct-bg: rgba(34, 197, 94, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    /* 頂部控制面板 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 16px 24px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .title-group h1 { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    .title-group p { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }

    .control-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary { background: var(--primary); color: #0f172a; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #334155; color: var(--text); }
    .btn-secondary:hover { background: #475569; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-success:hover { background: #059669; }
    .btn-warning { background: #f59e0b; color: #0f172a; }
    .btn-warning:hover { background: #d97706; }

    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .status-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .status-locked { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    /* 主區域兩欄佈局 */
    main {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      flex: 1;
    }

    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--primary);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .q-text {
      font-size: 1.35rem;
      line-height: 1.5;
      font-weight: 600;
      color: #fff;
    }

    pre code {
      display: block;
      background: #090d16;
      border: 1px solid #2a3447;
      padding: 14px;
      border-radius: 8px;
      font-family: "Fira Code", monospace;
      font-size: 1rem;
      color: #38bdf8;
      overflow-x: auto;
    }

    /* 選項與投票長條圖 */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 8px;
    }

    .option-box {
      background: #090d16;
      border: 2px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .option-box.is-correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
    }

    .option-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .opt-tag {
      font-size: 1.2rem;
      font-weight: 800;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: #fff;
    }
    .opt-tag-A { background: var(--accent-a); }
    .opt-tag-B { background: var(--accent-b); }
    .opt-tag-C { background: var(--accent-c); }
    .opt-tag-D { background: var(--accent-d); }

    .opt-count { font-size: 1.4rem; font-weight: 800; }
    .opt-text {
      margin-top: 10px;
      font-size: 1.1rem;
      color: #e2e8f0;
      position: relative;
      z-index: 2;
    }

    .progress-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: rgba(255, 255, 255, 0.08);
      z-index: 1;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 右側儀表板：即時統計與英雄榜 */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .side-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
    }

    .side-panel h3 {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-display {
      text-align: center;
      padding: 12px 0;
    }
    .stat-number { font-size: 3rem; font-weight: 900; color: var(--primary); }
    .stat-sub { color: var(--text-muted); font-size: 0.95rem; margin-top: 4px; }

    /* 答題排行榜 */
    .rank-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #090d16;
      padding: 10px 14px;
      border-radius: 8px;
      border-left: 4px solid var(--primary);
    }
    .rank-item:nth-child(1) { border-left-color: #f59e0b; background: rgba(245, 158, 11, 0.08); }
    .rank-item:nth-child(2) { border-left-color: #94a3b8; }
    .rank-item:nth-child(3) { border-left-color: #b45309; }

    .seat-badge { font-weight: 700; font-size: 1.05rem; }
    .time-badge { font-size: 0.9rem; color: var(--text-muted); font-family: monospace; }

    /* 詳解彈出區 */
    .explanation-box {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid var(--correct);
      border-radius: 8px;
      padding: 16px;
      color: #86efac;
      line-height: 1.5;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>⚡ 電子計算機二年級 — 課堂即時答題看板</h1>
      <p>班級代號: 201 ｜ 即時連線專案: my-teaching-tools ｜ 學生僅以座號識別</p>
    </div>
    <div class="control-group">
      <span id="session-status" class="status-badge status-active">● 開放作答中</span>
      <button id="btn-toggle-status" class="btn-warning" onclick="toggleActiveStatus()">暫停作答</button>
      <button id="btn-reveal" class="btn-success" onclick="revealAnswer()">揭曉正解</button>
      <button id="btn-mock" class="btn-secondary" onclick="simulateStudents()">🎲 隨機模擬 10 人</button>
      <button id="btn-next" class="btn-primary" onclick="nextQuestion()">下一題 ❯</button>
    </div>
  </header>

  <main>
    <!-- 左側題目與動態長條圖 -->
    <div class="question-card">
      <div class="q-meta">
        <span id="q-topic">單元：搜尋演算法</span>
        <span id="q-index">第 1 / 5 題</span>
      </div>
      <div class="q-text" id="q-content">題目載入中...</div>
      <pre id="q-code-container"><code id="q-code"></code></pre>

      <div class="options-grid">
        <div class="option-box" id="box-A">
          <div class="progress-bar" id="bar-A"></div>
          <div class="option-header">
            <span class="opt-tag opt-tag-A">A</span>
            <span class="opt-count" id="count-A">0 人 (0%)</span>
          </div>
          <div class="opt-text" id="text-A">選項 A</div>
        </div>
        <div class="option-box" id="box-B">
          <div class="progress-bar" id="bar-B"></div>
          <div class="option-header">
            <span class="opt-tag opt-tag-B">B</span>
            <span class="opt-count" id="count-B">0 人 (0%)</span>
          </div>
          <div class="opt-text" id="text-B">選項 B</div>
        </div>
        <div class="option-box" id="box-C">
          <div class="progress-bar" id="bar-C"></div>
          <div class="option-header">
            <span class="opt-tag opt-tag-C">C</span>
            <span class="opt-count" id="count-C">0 人 (0%)</span>
          </div>
          <div class="opt-text" id="text-C">選項 C</div>
        </div>
        <div class="option-box" id="box-D">
          <div class="progress-bar" id="bar-D"></div>
          <div class="option-header">
            <span class="opt-tag opt-tag-D">D</span>
            <span class="opt-count" id="count-D">0 人 (0%)</span>
          </div>
          <div class="opt-text" id="text-D">選項 D</div>
        </div>
      </div>

      <div class="explanation-box" id="explanation-box">
        <strong>💡 正解解析：</strong>
        <span id="explanation-text"></span>
      </div>
    </div>

    <!-- 右側統計與搶答英雄榜 -->
    <div class="sidebar">
      <div class="side-panel">
        <h3>全班作答進度</h3>
        <div class="stat-display">
          <div class="stat-number"><span id="stat-submitted">0</span><span style="font-size:1.5rem; color:#64748b;"> / 40</span></div>
          <div class="stat-sub">繳交率: <span id="stat-rate">0%</span></div>
        </div>
      </div>

      <div class="side-panel" style="flex:1;">
        <h3>⚡ 搶答速度榜 (前 5 名)</h3>
        <ul class="rank-list" id="rank-list">
          <li style="color:#64748b; text-align:center; padding: 20px 0;">尚未有作答資料</li>
        </ul>
      </div>
    </div>
  </main>

  <script>
    let questions = [];
    let currentQIndex = 0;
    let isActive = true;
    let isRevealed = false;
    let responses = {}; // key: "class_seat", val: { answer: 'A', time_ms: 1200 }

    // 初始化載入題目
    async function init() {
      try {
        const res = await fetch("questions.json");
        questions = await res.json();
        loadQuestion(0);
      } catch (e) {
        console.error("載入題庫失敗:", e);
      }
    }

    function loadQuestion(index) {
      if (!questions[index]) return;
      currentQIndex = index;
      isRevealed = false;
      isActive = true;
      responses = {};

      const q = questions[index];
      document.getElementById("q-topic").innerText = `單元：${q.topic}`;
      document.getElementById("q-index").innerText = `第 ${index + 1} / ${questions.length} 題`;
      document.getElementById("q-content").innerText = q.question;

      if (q.code) {
        document.getElementById("q-code-container").style.display = "block";
        document.getElementById("q-code").innerText = q.code;
      } else {
        document.getElementById("q-code-container").style.display = "none";
      }

      ["A", "B", "C", "D"].forEach(opt => {
        document.getElementById(`text-${opt}`).innerText = q.options[opt] || "";
        const box = document.getElementById(`box-${opt}`);
        box.classList.remove("is-correct");
      });

      document.getElementById("explanation-box").style.display = "none";
      document.getElementById("session-status").className = "status-badge status-active";
      document.getElementById("session-status").innerText = "● 開放作答中";
      document.getElementById("btn-toggle-status").innerText = "暫停作答";

      renderStats();
    }

    function renderStats() {
      const counts = { A: 0, B: 0, C: 0, D: 0 };
      const respList = Object.values(responses);
      const total = respList.length;

      respList.forEach(r => {
        if (counts[r.answer] !== undefined) counts[r.answer]++;
      });

      ["A", "B", "C", "D"].forEach(opt => {
        const c = counts[opt];
        const pct = total > 0 ? Math.round((c / total) * 100) : 0;
        document.getElementById(`count-${opt}`).innerText = `${c} 人 (${pct}%)`;
        document.getElementById(`bar-${opt}`).style.width = `${pct}%`;
      });

      document.getElementById("stat-submitted").innerText = total;
      document.getElementById("stat-rate").innerText = `${Math.round((total / 40) * 100)}%`;

      // 渲染排行榜 (依時間排序前 5 名)
      const rankListEl = document.getElementById("rank-list");
      if (total === 0) {
        rankListEl.innerHTML = `<li style="color:#64748b; text-align:center; padding: 20px 0;">尚未有作答資料</li>`;
      } else {
        const sorted = Object.entries(responses)
          .sort((a, b) => a[1].time_ms - b[1].time_ms)
          .slice(0, 5);

        rankListEl.innerHTML = sorted.map((item, idx) => `
          <li class="rank-item">
            <span class="seat-badge">#${idx + 1} 座號 ${item[0].split('_')[1]} 號</span>
            <span class="time-badge">⏱️ ${(item[1].time_ms / 1000).toFixed(2)} 秒</span>
          </li>
        `).join("");
      }
    }

    function toggleActiveStatus() {
      isActive = !isActive;
      const badge = document.getElementById("session-status");
      const btn = document.getElementById("btn-toggle-status");
      if (isActive) {
        badge.className = "status-badge status-active";
        badge.innerText = "● 開放作答中";
        btn.innerText = "暫停作答";
      } else {
        badge.className = "status-badge status-locked";
        badge.innerText = "🔒 已停止作答";
        btn.innerText = "重新開放";
      }
    }

    function revealAnswer() {
      isRevealed = true;
      const q = questions[currentQIndex];
      const correctBox = document.getElementById(`box-${q.answer}`);
      if (correctBox) correctBox.classList.add("is-correct");

      const expBox = document.getElementById("explanation-box");
      expBox.style.display = "block";
      document.getElementById("explanation-text").innerText = q.explanation;
    }

    function nextQuestion() {
      const nextIdx = (currentQIndex + 1) % questions.length;
      loadQuestion(nextIdx);
    }

    // 隨機模擬學生作答（教師課前演練或展示）
    function simulateStudents() {
      if (!isActive) return;
      const options = ["A", "B", "C", "D"];
      for (let i = 1; i <= 10; i++) {
        const randomSeat = Math.floor(Math.random() * 40) + 1;
        const key = `201_${randomSeat}`;
        if (!responses[key]) {
          responses[key] = {
            answer: options[Math.floor(Math.random() * options.length)],
            time_ms: Math.floor(Math.random() * 8000) + 1200
          };
        }
      }
      renderStats();
    }

    window.onload = init;
  </script>
</body>
</html>
